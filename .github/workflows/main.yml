name: Node.js CI/CD Pipeline.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-package-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Skip tests
      run: echo "No tests to run"

    - name: Archive build artefacts
      uses: actions/upload-artifact@v4
      with:
        name: node-build-artefact
        path: |
          dist/
          package.json

    - name: Log in to Docker registry
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-node-app:${{ github.sha }} .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/my-node-app:${{ github.sha }}

    - name: Tag latest
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/my-node-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest
